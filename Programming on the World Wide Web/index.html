<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - Nemertes</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="./style.css" rel="stylesheet">
</head>

<body class="flex items-center justify-center min-h-screen relative bg-gradient-to-r from-blue-900 via-purple-800 to-indigo-900">

    <div class="absolute inset-0 bg-black opacity-60"></div>

    <!-- Login Form Container -->
    <div class="relative z-10 flex flex-col items-center w-full max-w-2xl mx-auto text-white text-center">
        <h2 class="text-4xl font-bold underline underline-custom mt-8">Theses Repository</h2>

        <!-- Welcome Message -->
        <p class="mt-4 text-lg font-medium text-gray-200">Welcome! Type your username and password to login!</p>

        <div class="flex-1 flex flex-col justify-center px-4 sm:px-6 lg:flex-none lg:px-20 xl:px-24 mt-6" id="login_form">
            <div class="w-full max-w-md mx-auto rounded-lg shadow-lg bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 bg-opacity-90 transform transition-all duration-500 hover:shadow-2xl p-10">
                <div class="flex justify-center mb-6">
                </div>            
                <form id="login">
                    <div class="mb-6">
                        <label class="block text-gray-200 text-sm font-semibold mb-2" for="email">
                            Email
                        </label>
                        <input class="shadow-md border border-gray-400 rounded-lg w-full py-2 px-4 text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-yellow-700 focus:border-transparent transition duration-300" 
                               type="text" 
                               required 
                               id="email" 
                               placeholder="Enter your email">
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-gray-200 text-sm font-semibold mb-2" for="password">
                            Password
                        </label>
                        <input class="shadow-md border border-gray-400 rounded-lg w-full py-2 px-4 text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-yellow-700 focus:border-transparent transition duration-300" 
                               type="password" 
                               required 
                               id="password" 
                               placeholder="••••••••••">
                    </div>
    
                    <div class="flex justify-center">
                        <button class="bg-gradient-to-r from-blue-900 via-purple-800 to-indigo-900 text-white font-bold py-2 px-6 rounded-lg shadow-lg transform transition-all duration-300 hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-yellow-600" 
                                type="button" 
                                id="login_btn" 
                                onclick="login()">
                            Login
                        </button>
                    </div>

                    <div id="fadingSuccessNotification" class="hidden fixed inset-0 flex items-center justify-center z-50">
                        <div class="bg-gradient-to-r from-blue-900 via-purple-800 to-indigo-9000 text-white p-4 rounded-lg shadow-lg flex items-center space-x-3 transition-opacity duration-500 ease-out">
                            <i class="fa-solid fa-square-check fa-beat fa-2xl" style="color: #3b89ff;"></i>
                        <p class="text-lg font-bold">Login Successful! Redirecting...</p>
                        </div>
                    </div>

                    <div id="errorNotification" class="hidden fixed top-5 right-10 bg-gradient-to-r from-blue-900 via-purple-800 to-indigo-9000 text-white font-bold py-2 px-4 rounded shadow-lg z-50">
                        <i class="fa-solid fa-circle-exclamation fa-shake fa-2xl" style="color: #3b89ff;"></i>
                    </div>
                </form>
            </div>
        </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="./js/login.js"></script>
    <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
