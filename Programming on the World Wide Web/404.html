<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-white flex items-center justify-center min-h-screen p-6">

  <div class="max-w-lg w-full mx-auto bg-white bg-opacity-10 backdrop-blur-md text-white p-10 rounded-2xl shadow-2xl border border-purple-600">

    <div class="flex justify-center mb-6">
      <div class="w-24 h-24 flex items-center justify-center bg-purple-700 bg-opacity-30 rounded-full border-4 border-purple-500 animate-pulse">
        <span class="text-4xl font-bold text-purple-300">404</span>
      </div>
    </div>
    <header class="text-center mb-4">
      <h1 class="text-3xl font-bold text-purple-300">Page Not Found</h1>
      <p class="text-gray-300 mt-2">Oops! We couldn't find the page you were looking for.</p>
    </header>
    <div class="flex justify-center gap-4 mt-6">
      <a href="index.html" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-5 rounded-lg shadow-lg transition-all duration-200 hover:-translate-y-1">
        Go to Homepage
      </a>
      <a href="javascript:history.back()" class="bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-5 rounded-lg shadow-lg transition-all duration-200 hover:-translate-y-1">
        Go Back
      </a>
    </div>
  </div>

</body>
</html>
