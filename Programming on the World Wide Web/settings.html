<!DOCTYPE html>
<html lang="en">
<head>
    <title>Settings - Nemertes</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body class="min-h-screen bg-gradient-to-r from-indigo-900 via-purple-800 to-blue-900 flex">

    <!-- Sidebar (Vertical Navigation) -->
    <nav class="h-screen w-64 bg-purple-900 bg-opacity-90 text-white fixed top-0 left-0 flex flex-col py-6 px-4 shadow-lg">
        <div class="mb-6 px-4">
            <span class="text-3xl font-bold">Nemertes</span>
        </div>
        <div class="w-full flex flex-col space-y-4">
            <a href="student_dashboard.html" class="text-lg flex items-center gap-3 font-semibold py-3 px-6 w-full rounded hover:bg-purple-700 transition">
                <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>
            <a href="presentation.html" class="text-lg flex items-center gap-3 font-semibold py-3 px-6 w-full rounded hover:bg-purple-700 transition">
                <i class="fa-solid fa-chalkboard"></i> Presentation
            </a>
            <a href="presentation_feed.html" class="text-lg font-semibold py-3 px-6 w-full rounded hover:bg-purple-700 transition">
                <i class="fa-solid fa-bullhorn"></i> Announcements
            </a>
            <a href="settings.html" class="text-lg flex items-center gap-3 font-semibold py-3 px-6 w-full rounded bg-purple-700 transition">
                <i class="fa-solid fa-gear"></i> Settings
            </a>
        </div>
        <div class="mt-auto w-full px-4">
            <a href="./php/logout.php" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-3 px-6 w-full rounded-lg transition flex items-center">
                <i class="fa-solid fa-right-from-bracket mr-3"></i> Logout
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="ml-64 flex-1 p-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-purple-400">Settings</h1>
            <p class="text-gray-300">Manage your personal information and preferences</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Personal Information -->
            <section class="col-span-2 bg-white bg-opacity-20 backdrop-blur-lg p-6 rounded-lg shadow-lg">
                <h2 class="text-2xl font-bold text-purple-300 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-user-cog"></i> Personal Information
                </h2>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <!-- Address -->
                    <div>
                        <label class="text-white font-semibold flex items-center gap-2">
                            <i class="fa-solid fa-map-marker-alt"></i> Full Postal Address
                        </label>
                        <input type="text" id="address" class="w-full p-3 mt-2 border border-purple-500 bg-gray-800 text-white rounded-lg shadow-md focus:ring-2 focus:ring-purple-500">
                        <button onclick="updateSetting('address')" class="bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white font-bold py-2 px-4 mt-4 rounded-lg shadow-lg">
                            Update
                        </button>
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="text-white font-semibold flex items-center gap-2">
                            <i class="fa-solid fa-envelope"></i> Email Address
                        </label>
                        <input type="email" id="email" class="w-full p-3 mt-2 border border-purple-500 bg-gray-800 text-white rounded-lg shadow-md focus:ring-2 focus:ring-purple-500">
                        <button onclick="updateSetting('email')" class="bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white font-bold py-2 px-4 mt-4 rounded-lg shadow-lg">
                            Update
                        </button>
                    </div>

                    <!-- Mobile Phone -->
                    <div>
                        <label class="text-white font-semibold flex items-center gap-2">
                            <i class="fa-solid fa-mobile-screen-button"></i> Mobile Phone
                        </label>
                        <input type="text" id="mobile" class="w-full p-3 mt-2 border border-purple-500 bg-gray-800 text-white rounded-lg shadow-md focus:ring-2 focus:ring-purple-500">
                        <button onclick="updateSetting('mobile')" class="bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white font-bold py-2 px-4 mt-4 rounded-lg shadow-lg">
                            Update
                        </button>
                    </div>

                    <!-- Landline Phone -->
                    <div>
                        <label class="text-white font-semibold flex items-center gap-2">
                            <i class="fa-solid fa-phone"></i> Landline Phone
                        </label>
                        <input type="text" id="phone" class="w-full p-3 mt-2 border border-purple-500 bg-gray-800 text-white rounded-lg shadow-md focus:ring-2 focus:ring-purple-500">
                        <button onclick="updateSetting('phone')" class="bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white font-bold py-2 px-4 mt-4 rounded-lg shadow-lg">
                            Update
                        </button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="./js/settings.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
