<!DOCTYPE html>
<html lang="en">
<head>
    <title>Prof Dashboard - Nemertes</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="./style.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-gradient-to-r from-indigo-900 via-purple-800 to-blue-900 text-white">
    <!-- Navigation Bar -->
    <nav class="h-screen w-64 bg-purple-900 text-white fixed top-0 left-0 flex flex-col items-start py-6 px-4 shadow-lg rounded-md">
        <!-- Logo -->
        <div class="mb-6 px-4">
            <span class="text-3xl font-bold">Nemertes</span>
        </div>
    
        <!-- Navigation Links -->
        <div class="w-full flex flex-col space-y-3">
            <a href="prof.html" class="text-lg font-semibold py-3 px-6 w-full rounded hover:bg-purple-700 transition">
                <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>
            <a href="theses.html" class="text-lg font-semibold py-3 px-6 w-full rounded hover:bg-purple-700 transition">
                <i class="fa-solid fa-book"></i> Theses
            </a>
            <a href="stats.html" class="text-lg font-semibold py-3 px-6 w-full rounded hover:bg-purple-700 transition">
                <i class="fa-solid fa-chart-pie"></i> Stats
            </a>
            <a href="students.html" class="text-lg font-semibold py-3 px-6 w-full rounded hover:bg-purple-700 transition">
                <i class="fa-solid fa-user-graduate"></i> Students
            </a>
            <a href="invitations.html" class="text-lg font-semibold py-3 px-6 w-full rounded hover:bg-purple-700 transition">
                <i class="fa-solid fa-envelope"></i> Invitations
            </a>
            <a href="presentation_feed.html" class="text-lg font-semibold py-3 px-6 w-full rounded hover:bg-purple-700 transition">
                <i class="fa-solid fa-bullhorn"></i> Announcements
            </a>
        </div>
    
        <!-- Logout Button (at Bottom) -->
        <div class="mt-auto w-full px-4">
            <a href="./php/logout.php" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-3 px-6 w-full rounded-lg transition flex items-center">
                <i class="fa-solid fa-right-from-bracket mr-3"></i> Logout
            </a>
        </div>
    </nav>
    
    
    

        <!-- Main Content -->
        <main class="ml-96 mr-auto max-w-12xl p-8">
            <!-- Dashboard Cards -->
            <section class="grid grid-cols-1 lg:grid-cols-3 gap-8 w-full">

                <!-- Notes & Status Column -->
                <div class="col-span-1 bg-white bg-opacity-20 backdrop-blur-lg rounded-2xl shadow-xl p-6 flex flex-col justify-between space-y-6 hover:shadow-2xl transition">
              
                  <div>
                    <h2 class="text-2xl font-bold text-purple-300 mb-4">Thesis Actions</h2>
                    <div id="thesisCardsContainer" class="space-y-2 max-h-48 overflow-y-auto scrollbar-thin scrollbar-thumb-purple-400 pr-2"></div>
                  </div>
              
                  <div>
                    <div id="notesContainer" class="mb-2"></div>
                    <textarea id="noteTextArea" rows="4" maxlength="300"
                      class="w-full bg-gray-900 bg-opacity-30 text-white border border-gray-600 rounded-lg p-3 resize-none placeholder-gray-400"
                      placeholder="Enter your notes (max 300 characters)">
                    </textarea>
                    <button onclick="saveNote()"
                      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg mt-2 flex justify-center items-center gap-2">
                      <i class="fas fa-save"></i> Save Note
                    </button>
                  </div>
              
                  <div>
                    <h3 class="text-lg font-semibold text-purple-400 mb-2">Cancel Thesis</h3>
                    <button onclick="cancelThesis()"
                      class="w-full bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 rounded-lg flex justify-center items-center gap-2">
                      <i class="fas fa-ban"></i> Cancel Assignment
                    </button>
                  </div>
              
                  <div>
                    <h3 class="text-lg font-semibold text-purple-400 mb-2">Update Status</h3>
                    <button onclick="changeToUnderReview()"
                      class="w-full bg-purple-700 hover:bg-purple-900 text-white font-semibold py-2 rounded-lg flex justify-center items-center gap-2">
                      <i class="fas fa-arrow-up"></i> Move to Under Review
                    </button>
                  </div>
                </div>
              
                <div class="col-span-2 bg-white bg-opacity-20 backdrop-blur-lg rounded-2xl shadow-xl p-6 hover:shadow-2xl transition flex flex-col h-[85vh]">
                    <h2 class="text-2xl font-bold text-purple-300 mb-4">Created Theses</h2>
                  
                    <ul id="thesesList" class="overflow-y-auto flex-grow scrollbar-thin scrollbar-thumb-purple-400 pr-2 space-y-3">
                      <!-- dynamic content -->
                    </ul>
                  </div>
                  
  
              
              </section>
              

        </section>

        <!-- Modal for Editing Thesis -->
        <div id="thesisModal" class="hidden fixed inset-0  flex items-center text-sm justify-center bg-black bg-opacity-90 backdrop-blur-lg">
            <div class="bg-white bg-opacity-20 backdrop-blur-lg rounded-lg shadow-lg p-4 w-2/5 max-w-lg scale-90">
                <!-- Close Button -->
                <button onclick="closeModal()" class="absolute top-4 right-6 text-gray-300 hover:text-purple-400 transition">
                    <i class="fa-regular fa-rectangle-xmark text-2xl"></i>
                </button>

                <!-- Modal Title -->
                <h2 class="text-2xl font-bold text-purple-300 mb-4">Edit Thesis</h2>

                <!-- Title -->
                <label class="block text-gray-300 font-semibold mb-2">Title</label>
                <input type="text" id="modalTitle" class="w-full p-2 border border-gray-500 bg-gray-900 bg-opacity-30 text-white rounded-md mb-4" />

                <!-- Abstract -->
                <label class="block text-gray-300 font-semibold mb-2">Abstract</label>
                <textarea id="modalAbstract" class="w-full p-2 border border-gray-500 bg-gray-900 bg-opacity-30 text-white rounded-md mb-4"></textarea>

                <!-- Student -->
                <label class="block text-gray-300 font-semibold mb-2">Student</label>
                <input type="text" id="modalStudent" class="w-full p-2 border border-gray-500 bg-gray-900 bg-opacity-30 text-white rounded-md mb-4" readonly />

                <!-- Supervisor -->
                <label class="block text-gray-300 font-semibold mb-2">Supervisor</label>
                <input type="text" id="modalSupervisor" class="w-full p-2 border border-gray-500 bg-gray-900 bg-opacity-30 text-white rounded-md mb-4" readonly />

                <!-- Co-Supervisor 1 -->
                <label class="block text-gray-300 font-semibold mb-2">Co-supervisor 1</label>
                <input type="text" id="modalCoSupervisor1" class="w-full p-2 border border-gray-500 bg-gray-900 bg-opacity-30 text-white rounded-md mb-4" readonly />

                <!-- Co-Supervisor 2 -->
                <label class="block text-gray-300 font-semibold mb-2">Co-supervisor 2</label>
                <input type="text" id="modalCoSupervisor2" class="w-full p-2 border border-gray-500 bg-gray-900 bg-opacity-30 text-white rounded-md mb-4" readonly />

                <!-- Update Status -->
                <label class="block text-gray-300 font-semibold mb-2">Update Date</label>
                <input type="text" id="modalAcceptance" class="w-full p-2 border border-gray-500 bg-gray-900 bg-opacity-30 text-white rounded-md mb-4" readonly />

                <!-- Assigned At -->
                <label class="block text-gray-300 font-semibold mb-2">Assigned At</label>
                <input type="text" id="modalAssigned" class="w-full p-2 border border-gray-500 bg-gray-900 bg-opacity-30 text-white rounded-md mb-4" readonly />

                <!-- Save & Cancel Buttons -->
                <div class="flex justify-end space-x-4">
                    <button onclick="saveThesisChanges()" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-6 rounded-lg">Save</button>
                    <button onclick="closeModal()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-lg">Cancel</button>
                </div>
            </div>
        </div>


        <!-- Assign Student Modal -->
        <div id="assignModal" class="hidden fixed inset-0 flex items-center justify-center">
            <div class="bg-gray-800 bg-opacity-90 backdrop-blur-lg rounded-lg shadow-lg p-6 w-80 max-w-md">
                <h3 class="text-2xl font-bold text-purple-300 mb-4">Assign Student</h3>

                <label class="block text-gray-300 font-semibold mb-2">Search by AM</label>
                <input type="text" id="searchAM" class="w-full p-2 border border-gray-500 bg-gray-900 bg-opacity-30 text-white rounded-md mb-4" placeholder="Enter Student AM" />

                <button onclick="searchStudent()" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-6 rounded-lg">Search</button>

                <div id="studentInfo" class="mt-6 hidden">
                    <p id="studentName" class="text-white font-semibold"></p>
                    <p id="studentDepartment" class="text-gray-300"></p>
                    <button onclick="confirmAssignment()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 mt-4 rounded-lg">Confirm</button>
                </div>

                <button onclick="closeAssignModal()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-lg mt-4">Cancel</button>
            </div>
        </div>

        <div id="changePdfModal" class="hidden fixed inset-0 bg-purple-700 bg-opacity-40 flex items-center justify-center">
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg w-3/4 max-w-lg">
                <h2 class="text-xl font-bold text-purple-800 mb-4">Change PDF</h2>
                <input type="file" id="newPdfFile" accept=".pdf" class="mb-4">
                <div class="flex justify-end space-x-4">
                    <button id="cancelChangePdf" class="bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded">Cancel</button>
                    <button id="saveNewPdf" class="bg-purple-500 hover:bg-purple-600 text-white py-2 px-4 rounded">Upload</button>
                </div>
            </div>
        </div>                
       
    </main>


    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="./js/prof.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
