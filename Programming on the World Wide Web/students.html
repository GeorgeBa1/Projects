    <main class="ml-64 flex-1 p-8">
        <!-- Header Section -->
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-purple-400">Supervising</h1>
            <p class="text-lg font-semibold text-gray-300">Detailed view of completed and ongoing theses</p>
        </header>
        
        <!-- Filters -->
        <div class="flex items-center space-x-4 mb-6">
            <select id="statusFilter" class="p-2 border border-gray-600 bg-gray-800 text-white rounded hover:bg-gray-700 transition">
                <option value="">All Statuses</option>
                <option value="under_assignment">Under Assignment</option>
                <option value="active">Active</option>
                <option value="under_review">Under Review</option>
                <option value="completed">Completed</option>
            </select>
            <select id="roleFilter" class="p-2 border border-gray-600 bg-gray-800 text-white rounded hover:bg-gray-700 transition">
                <option value="">All Roles</option>
                <option value="supervisor1">Supervisor 1</option>
                <option value="committee">Committee Member</option>
            </select>
    
            <!-- Export Buttons -->
            <div class="flex space-x-2" id="exportButtons">
                <button id="exportToCSV" class="flex items-center space-x-2 bg-purple-700 hover:bg-purple-800 text-white font-semibold py-2 px-4 rounded-lg shadow transition-transform transform hover:scale-105">
                    <i class="fa-solid fa-file-csv"></i>
                    <span>Export CSV</span>
                </button>
                <button id="exportToJSON" class="flex items-center space-x-2 bg-purple-700 hover:bg-purple-800 text-white font-semibold py-2 px-4 rounded-lg shadow transition-transform transform hover:scale-105">
                    <i class="fa-solid fa-file-export"></i>
                    <span>Export JSON</span>
                </button>
                <button id="cTheses" class="flex items-center space-x-2 bg-purple-700 hover:bg-purple-800 text-white font-semibold py-2 px-4 rounded-lg shadow transition-transform transform hover:scale-105">
                    Cancelled Theses
                </button>
            </div>
            
        </div>
    
        <!-- Theses List -->
        <div id="thesisList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        
        <!-- Thesis Details Modal -->
        <div id="thesisModal2" class="fixed inset-0 bg-gray-900 bg-opacity-90 backdrop-blur-lg flex items-center justify-center text-sm hidden">
            <div class="bg-white bg-opacity-20 backdrop-blur-lg p-6 rounded-lg shadow-xl w-11/12 md:w-2/3 lg:w-1/2 max-h-[60vh] overflow-y-auto">
                <button id="closeModalBtn" class="float-right text-gray-500 hover:text-purple-500 transition-transform transform hover:scale-150">
                    <i class="fa-regular fa-rectangle-xmark"></i>
                </button>
                <h2 id="modalTitle" class="text-3xl font-bold text-purple-400 mb-4"></h2>
                <div id="modalContent" class="space-y-4 text-gray-200"></div>
            </div>
        </div>
    
        <!-- Grading Modal -->
        <div id="gradingModal" class="fixed inset-0 hidden bg-gray-900 bg-opacity-90 flex items-center justify-center">
            <div class="bg-white bg-opacity-20 backdrop-blur-lg p-8 rounded-lg shadow-lg w-96">
                <h2 class="text-2xl font-bold text-purple-400 mb-6">Grade Thesis</h2>
                <div class="flex flex-col space-y-4">
                    <label class="text-gray-300">Quality of Thesis (60%)</label>
                    <input id="criteria1" type="number" min="0" max="10" class="p-2 border border-gray-600 bg-gray-800 text-white rounded" placeholder="0-10">
        
                    <label class="text-gray-300">Completion Time (15%)</label>
                    <input id="criteria2" type="number" min="0" max="10" class="p-2 border border-gray-600 bg-gray-800 text-white rounded" placeholder="0-10">
        
                    <label class="text-gray-300">Quality of Text (15%)</label>
                    <input id="criteria3" type="number" min="0" max="10" class="p-2 border border-gray-600 bg-gray-800 text-white rounded" placeholder="0-10">
        
                    <label class="text-gray-300">Overall Presentation (10%)</label>
                    <input id="criteria4" type="number" min="0" max="10" class="p-2 border border-gray-600 bg-gray-800 text-white rounded" placeholder="0-10">
                </div>
                <div class="flex justify-end space-x-4 mt-6">
                    <button onclick="saveGrades()" class="bg-purple-500 hover:bg-purple-600 text-white py-2 px-6 rounded">Save</button>
                    <button onclick="closeGradingModal()" class="bg-gray-500 hover:bg-gray-600 text-white py-2 px-6 rounded">Cancel</button>
                </div>
            </div>
        </div>
        
    </main>
